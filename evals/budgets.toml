# Ceilings that `make perf-check` applies to a fresh overhead run (tmp/evals/overhead.json). One [overhead.<scenario>] table per scenario; a key is any numeric field of that scenario's result. They catch regressions, not noise, so they sit well above the medians measured on a 1 vCPU sandbox. Tighten a ceiling only with a run from the CI runner attached to the pull request.

[overhead.startup]
wall_ms_median = 80
rss_mib_median = 48

[overhead.round-trip]
wall_ms_median = 250
rss_mib_median = 80
requests = 1

[overhead.round-trip-responses]
wall_ms_median = 250
requests = 1

[overhead.round-trip-messages]
wall_ms_median = 250
requests = 1

# Ratchet on SlopCodeBench-style metrics over hand-written Go (make slop). Set at the measured launch baseline: lower them as refactors land; never raise them to admit new code. Go's explicit error branches raise cyclomatic complexity, so compare these with wopr's own history, not other languages.
[slop]
max_verbosity = 0.050
max_erosion = 0.660
